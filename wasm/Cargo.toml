[package]
name = "html_pdf_wasm"
version = "0.1.2"
edition = "2024"
authors = ["Yuri Rubtsov <rosperitus@gmail.com>"]
license = "MIT"
description = "WebAssembly bindings for html_pdf"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
html_pdf = { path = ".." }
js-sys = "0.3"
wasm-bindgen = "=0.2.128"

# wasm-opt would be downloaded on first build; LTO already shrinks the module.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
