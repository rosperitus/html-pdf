[package]
name = "html_pdf"
version = "0.1.2"
edition = "2024"
authors = ["Yuri Rubtsov <rosperitus@gmail.com>"]
license = "MIT"
description = "HTML and CSS to paginated PDF, with no browser"

[dependencies]
miniz_oxide = "0.9.1"
ttf-parser = { version = "0.25.1", default-features = false, features = ["std"] }

[workspace]
members = ["wasm"]

[profile.release]
lto = true
codegen-units = 1
